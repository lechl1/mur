excluded:
  - .build
  - .xcode-build
  - ./ShellParserGenerated

# mur — THIS LINTER LOOKS FOR BUGS, NOT FOR TASTE.
#
# Every rule below flags something that can actually misbehave at runtime:
# a swallowed error, a leaked observer, a dead notification, a comparison
# that is always true, a test that silently never runs. Nothing here is
# about spacing, ordering, naming or line width — formatting is SwiftFormat's
# job (`./format.sh`), and it rewrites the code instead of nagging about it.
#
# The bar for adding a rule: it must name a defect, and a violation of it
# must be worth stopping the build for (`strict: true` below turns every
# warning into an error). If a rule is only "we'd rather write it the other
# way", it does not belong in this file.
#
# https://realm.github.io/SwiftLint/rule-directory.html
only_rules:
  # --- Silently wrong control flow -----------------------------------------
  - duplicate_conditions # Two branches with the same condition: the second is dead
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal # Later key silently wins
  - identical_operands # `x == x` — always true; the comparison meant something else
  - no_fallthrough_only
  - return_value_from_void_function # The value is discarded, not returned
  - unavailable_condition # #available with an empty body inverts the check
  - unused_control_flow_label # `break outer` that doesn't break the outer loop
  - unused_setter_value # A setter that ignores `newValue` silently does nothing

  # --- Concurrency & lifetime ----------------------------------------------
  - unhandled_throwing_task # `Task { try … }` parks the error where nobody reads it
  - unowned_variable_capture # `unowned` outlives its referent → crash
  - weak_delegate # A strong delegate is a retain cycle
  - discarded_notification_center_observer # Dropped token = unremovable registration
  - notification_center_detachment # Removing the wrong observer
  - self_in_property_initialization # `self` before it exists
  - block_based_kvo
  - class_delegate_protocol # A struct delegate can't be weak

  # --- Wrong API for the job ------------------------------------------------
  - compiler_protocol_init # Initializers the compiler reserves for literals
  - discouraged_direct_init # e.g. `UIDevice()` — never the instance you want
  - dynamic_inline # `dynamic` + `@inline(__always)` is undefined behaviour
  - force_try # `try!` crashes the process on a thrown error
  - ns_number_init_as_function_reference
  - nsobject_prefer_isequal # `==` on NSObject subclasses isn't what gets called
  - non_optional_string_data_conversion # The failable path hides that it can't fail
  - raw_value_for_camel_cased_codable_enum # Encodes/decodes a different string than you think
  - deployment_target # @available checks below the deployment target are dead code

  # --- Declarations that don't do what they look like ------------------------
  - lower_acl_than_parent # `public` inside an internal type grants nothing
  - private_swiftui_state # Non-private @State is settable from outside, honoured only once
  - overridden_super_call
  - prohibited_super_call
  - local_doc_comment # A doc comment in a local scope documents nothing
  - orphaned_doc_comment # A doc comment attached to nothing

  # --- Tests that don't run --------------------------------------------------
  - private_unit_test # A private XCTestCase method is never executed
  - test_case_accessibility
  - empty_xctest_method

  # --- The linter itself -----------------------------------------------------
  - invalid_swiftlint_command
  - superfluous_disable_command # A disable for a rule that isn't firing

# Deliberately NOT enabled, with reasons — don't re-add without one:
#   force_cast / force_unwrapping   — crash-safety style, not defect detection.
#                                     ~100 sites inherited from AeroSpace, most
#                                     provably safe; each "fix" is a behaviour
#                                     decision, not a mechanical edit.
#   implicitly_unwrapped_optional   — production code has zero; the only users
#                                     are XCTest scaffolding, where the IUO is
#                                     the idiom.
#   async_without_await             — has no protocol awareness, so it flags
#                                     conformances that MUST be `async`.
#   optional_data_string_conversion — wants the failable Data->String init; mur
#                                     decodes a bounded head of a transcript
#                                     that IS cut mid-codepoint, where the
#                                     failable init would return nil.
#   unused_parameter, comment_spacing, unneeded_override, mark, and every
#   style/idiomatic/metrics rule    — aesthetics. SwiftFormat's job.

# Warnings are errors. A bug-only rule set has no violations worth ignoring.
strict: true
